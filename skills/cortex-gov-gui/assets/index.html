<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cortex GOV Projects Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-layer"></div>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">CORTEX</div>
          <div>
            <div class="brand-title">Cortex GOV Projects Console</div>
            <div class="brand-subtitle">Manage Cortex GOV PROJECT.md folders in the OpenClaw workspace</div>
          </div>
        </div>
        <div class="topbar-controls">
          <div class="workspace-chip">
            <span>Workspace root</span>
            <code id="workspace-path">-</code>
          </div>
          <button id="refresh-btn" class="btn primary">Rescan</button>
        </div>
      </header>

      <div id="status" class="status hidden"></div>

      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <span>Projects</span>
            <span id="project-count" class="badge">0</span>
          </div>
          <input id="search" class="search" type="search" placeholder="Filter by name or path" />
          <div id="project-list" class="project-list"></div>
        </aside>

        <main class="main">
          <section id="project-details" class="panel"></section>

          <section class="panel">
            <div class="panel-header">
              <div>
                <h3>Agents</h3>
                <p>Agents linked to this project workspace</p>
              </div>
            </div>
            <div id="agents-list" class="agent-list"></div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div>
                <h3>Spawn Agent</h3>
                <p>Create or configure new agents for this project</p>
              </div>
            </div>
            <form id="spawn-form" class="spawn-form">
              <div class="field">
                <label>Agent ID (optional)</label>
                <input id="spawn-id" type="text" placeholder="e.g. analytics-bot" />
                <small>If set, prefix/count are ignored.</small>
              </div>
              <div class="field-grid">
                <div class="field">
                  <label>Prefix</label>
                  <input id="spawn-prefix" type="text" placeholder="project" />
                </div>
                <div class="field">
                  <label>Count</label>
                  <input id="spawn-count" type="number" min="1" value="1" />
                </div>
              </div>
              <div class="field-grid">
                <div class="field">
                  <label>Model</label>
                  <input id="spawn-model" type="text" placeholder="Leave empty to inherit default" />
                </div>
                <div class="field">
                  <label>Heartbeat Every</label>
                  <input id="spawn-heartbeat" type="text" placeholder="e.g. 30m, 2h" />
                </div>
              </div>
              <div class="field">
                <label>Heartbeat Prompt (optional)</label>
                <textarea id="spawn-prompt" rows="3" placeholder="Defaults to the project control doc prompt"></textarea>
              </div>
              <div class="field">
                <label>Binds (optional)</label>
                <input id="spawn-binds" type="text" placeholder="channel[:accountId], comma-separated" />
              </div>
              <div class="actions">
                <button type="submit" class="btn primary">Create Agent(s)</button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
